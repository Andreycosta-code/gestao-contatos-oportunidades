
services:
  postgres:
    image: postgres:17
    container_name: gestao-contatos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_contatos
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestao_contatos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
