# ===== Aplicacao =====
spring.application.name=gestao-contatos

# ===== Base de dados (PostgreSQL) =====
# Definir as variaveis de ambiente antes de arrancar a aplicacao:
#   DB_URL      (opcional, por omissao usa localhost)
#   DB_USERNAME (obrigatoria)
#   DB_PASSWORD (obrigatoria)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_contatos}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# "update" so em desenvolvimento; considerar migracoes (Flyway) mais tarde.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Thymeleaf =====
# Cache desativada para facilitar o desenvolvimento; ativar em producao.
spring.thymeleaf.cache=false

# ===== Internacionalizacao =====
spring.web.locale=pt_PT