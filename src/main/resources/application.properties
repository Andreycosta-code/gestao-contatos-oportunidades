# ===== Aplicacao =====
spring.application.name=gestao-contatos

# ===== Base de dados (PostgreSQL) =====
# Definir as variaveis de ambiente antes de arrancar a aplicacao:
#   DB_URL      (opcional, por omissao usa localhost)
#   DB_USERNAME (obrigatoria)
#   DB_PASSWORD (obrigatoria)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_contatos}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Internacionalizacao =====
spring.web.locale=pt_PT

# ===== Autenticacao (conta unica) =====
# As credenciais sao fornecidas pelo ficheiro .env, nunca pelo Git.
app.security.username=${APP_USERNAME:eurico}
app.security.password=${APP_PASSWORD}
server.port=${PORT:8080}