<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sessão | Gestão de Contactos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/crm.css}">
</head>
<body class="crm-body login-body">

<main class="login-container">
    <section class="login-card">

        <div class="login-brand-icon">
            <i class="bi bi-briefcase-fill"></i>
        </div>

        <p class="login-eyebrow">GESTÃO PROFISSIONAL</p>
        <h1>Bem-vindo</h1>
        <p class="login-description">
            Inicia sessão para aceder à tua área de gestão.
        </p>

        <div th:if="${param.error}" class="alert alert-danger">
            Utilizador ou palavra-passe incorretos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Sessão terminada com sucesso.
        </div>

        <form th:action="@{/login}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="username" class="form-label">Utilizador</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Introduz o teu utilizador"
                       autocomplete="username"
                       required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Palavra-passe</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Introduz a tua palavra-passe"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary login-button">
                Iniciar sessão
            </button>
        </form>

        <p class="login-footer">
            Sistema de Gestão de Contactos e Oportunidades
        </p>

    </section>
</main>

</body>
</html>
