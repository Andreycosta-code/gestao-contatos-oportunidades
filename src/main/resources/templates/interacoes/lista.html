
<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de interações | Gestão de Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3">
    <div class="container">
        <h1 class="h4 mb-0">Gestão de Contactos e Oportunidades</h1>
    </div>
</header>

<main class="container py-5">

    <div class="mb-4">
        <h2 class="h3">Histórico de interações</h2>
        <p class="text-muted mb-1">
            Oportunidade:
            <strong th:text="${oportunidade.descricao}"></strong>
        </p>
        <a th:href="@{/oportunidades}"
           class="btn btn-sm btn-outline-secondary mt-2">
            Voltar às oportunidades
        </a>
    </div>

    <div th:if="${param.sucesso}" class="alert alert-success">
        Interação registada com sucesso!
    </div>

    <div th:if="${erro}" class="alert alert-danger"
         th:text="${erro}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body p-4">

            <h3 class="h5 mb-3">Registar nova interação</h3>

            <form th:action="@{/interacoes/salvar/{id}(id=${oportunidade.id})}"
                  th:object="${interacao}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="tipoInteracao" class="form-label">
                        Tipo de interação *
                    </label>
                    <select id="tipoInteracao"
                            th:field="*{tipoInteracao}"
                            class="form-select" required>
                        <option value="">Selecione o tipo</option>
                        <option th:each="tipo : ${tiposInteracao}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>
                    </select>
                    <div class="text-danger small"
                         th:errors="*{tipoInteracao}"></div>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">
                        Descrição da interação *
                    </label>
                    <textarea id="descricao"
                              th:field="*{descricao}"
                              class="form-control"
                              rows="3"
                              maxlength="1000"
                              placeholder="Descreva o contacto ou o que foi combinado..."
                              required></textarea>
                    <div class="text-danger small"
                         th:errors="*{descricao}"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Registar interação
                </button>

            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h3 class="h5 mb-3">Interações registadas</h3>

            <div th:if="${#lists.isEmpty(interacoes)}"
                 class="text-center py-4">
                <p class="text-muted mb-0">
                    Ainda não existem interações registadas para esta oportunidade.
                </p>
            </div>

            <div th:unless="${#lists.isEmpty(interacoes)}">

                <div th:each="interacao : ${interacoes}"
                     class="border-bottom py-3">

                    <div class="d-flex justify-content-between flex-wrap gap-2">
                        <strong th:text="${interacao.tipoInteracao}"></strong>

                        <small class="text-muted"
                               th:text="${#temporals.format(interacao.dataInteracao, 'dd/MM/yyyy HH:mm')}">
                        </small>
                    </div>

                    <p class="mb-0 mt-2"
                       th:text="${interacao.descricao}"></p>

                </div>

            </div>

        </div>
    </div>

</main>

</body>
</html>
