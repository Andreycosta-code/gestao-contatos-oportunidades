
<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oportunidade | Gestão de Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3">
    <div class="container">
        <h1 class="h4 mb-0">Gestão de Contactos e Oportunidades</h1>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="h4 mb-4"
                        th:text="${oportunidade.id == null ? 'Cadastrar oportunidade' : 'Editar oportunidade'}">
                        Cadastrar oportunidade
                    </h2>

                    <div th:if="${erro}" class="alert alert-danger"
                         th:text="${erro}"></div>

                    <form th:action="${oportunidade.id == null}
                          ? @{/oportunidades/salvar}
                          : @{/oportunidades/atualizar/{id}(id=${oportunidade.id})}"
                          th:object="${oportunidade}" method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="descricao" class="form-label">
                                Descrição do trabalho *
                            </label>
                            <textarea id="descricao"
                                      th:field="*{descricao}"
                                      class="form-control"
                                      rows="3"
                                      maxlength="500"
                                      required></textarea>
                            <div class="text-danger small"
                                 th:errors="*{descricao}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="contato" class="form-label">
                                Contacto *
                            </label>
                            <select id="contato"
                                    th:field="*{contato.id}"
                                    class="form-select" required>
                                <option value="">Selecione um contacto</option>
                                <option th:each="contato : ${contatos}"
                                        th:value="${contato.id}"
                                        th:text="${contato.nome}">
                                </option>
                            </select>
                            <div class="text-danger small"
                                 th:errors="*{contato}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label">
                                    Estado *
                                </label>
                                <select id="estado"
                                        th:field="*{estado}"
                                        class="form-select" required>
                                    <option th:each="estado : ${estados}"
                                            th:value="${estado}"
                                            th:text="${estado}">
                                    </option>
                                </select>
                                <div class="text-danger small"
                                     th:errors="*{estado}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="prioridade" class="form-label">
                                    Prioridade *
                                </label>
                                <select id="prioridade"
                                        th:field="*{prioridade}"
                                        class="form-select" required>
                                    <option th:each="prioridade : ${prioridades}"
                                            th:value="${prioridade}"
                                            th:text="${prioridade}">
                                    </option>
                                </select>
                                <div class="text-danger small"
                                     th:errors="*{prioridade}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="prazoResposta" class="form-label">
                                    Prazo para resposta
                                </label>
                                <input type="date"
                                       id="prazoResposta"
                                       th:field="*{prazoResposta}"
                                       class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="tempoEstimadoDias" class="form-label">
                                    Tempo estimado (dias)
                                </label>
                                <input type="number"
                                       id="tempoEstimadoDias"
                                       th:field="*{tempoEstimadoDias}"
                                       class="form-control"
                                       min="1">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="valorAReceber" class="form-label">
                                Valor previsto a receber (€)
                            </label>
                            <input type="number"
                                   id="valorAReceber"
                                   th:field="*{valorAReceber}"
                                   class="form-control"
                                   min="0"
                                   step="0.01">
                            <div class="text-danger small"
                                 th:errors="*{valorAReceber}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Guardar oportunidade
                            </button>
                            <a th:href="@{/oportunidades}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
