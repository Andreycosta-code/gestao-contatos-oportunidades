<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gestão de contactos e oportunidades de trabalho">
<title th:text="${titulo} + ' | Gestão de Contactos e Oportunidades'">Gestão de Contactos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/crm.css}">
<link rel="stylesheet" th:href="@{/acessibilidade.css}">
</head>
<body xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar(ativo)" class="crm-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralTitulo">
  <div class="offcanvas-header d-lg-none">
    <span class="crm-brand-name" id="menuLateralTitulo">Gestão de Contactos</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menuLateral" aria-label="Fechar menu"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column p-0">
    <a th:href="@{/}" class="crm-brand" aria-label="Página inicial">
      <span class="crm-brand-icon"><i class="bi bi-briefcase-fill" aria-hidden="true"></i></span>
      <span><strong>Gestão de Contactos</strong><small>e Oportunidades</small></span>
    </a>
    <div class="crm-nav-caption">MENU PRINCIPAL</div>
    <nav class="crm-nav" aria-label="Navegação principal">
      <a th:href="@{/}" class="crm-nav-link" th:classappend="${ativo == 'dashboard'} ? ' active' : ''" th:attr="aria-current=${ativo == 'dashboard'} ? 'page' : null"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i><span>Painel</span></a>
      <a th:href="@{/contatos}" class="crm-nav-link" th:classappend="${ativo == 'contatos'} ? ' active' : ''" th:attr="aria-current=${ativo == 'contatos'} ? 'page' : null"><i class="bi bi-people-fill" aria-hidden="true"></i><span>Contactos</span></a>
      <a th:href="@{/oportunidades}" class="crm-nav-link" th:classappend="${ativo == 'oportunidades'} ? ' active' : ''" th:attr="aria-current=${ativo == 'oportunidades'} ? 'page' : null"><i class="bi bi-kanban-fill" aria-hidden="true"></i><span>Oportunidades</span></a>
    </nav>
    <div class="crm-sidebar-footer mt-auto"><div class="crm-sidebar-note"><i class="bi bi-shield-check" aria-hidden="true"></i><span>Área de gestão</span></div></div>
  </div>
</aside>
<header th:fragment="topbar(titulo)" class="crm-topbar">

    <div class="d-flex align-items-center gap-3">
        <button class="btn crm-menu-toggle d-lg-none"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menuLateral"
                aria-controls="menuLateral"
                aria-label="Abrir menu de navegação">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <div>
            <div class="crm-topbar-eyebrow">GESTÃO PROFISSIONAL</div>
            <h1 class="crm-topbar-title" th:text="${titulo}">Painel</h1>
        </div>
    </div>

    <div class="d-flex align-items-center gap-2">

        <button type="button"
                id="botao-contraste"
                class="btn btn-sm crm-contrast-button"
                aria-pressed="false">
            <i class="bi bi-circle-half me-1" aria-hidden="true"></i>
            <span>Ativar alto contraste</span>
        </button>

        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="btn btn-sm btn-outline-danger"
                    style="min-height: 40px;">
                <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>
                Terminar sessão
            </button>
        </form>

    </div>

</header>
<div th:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/acessibilidade.js}"></script>
</div>
</body>
</html>
