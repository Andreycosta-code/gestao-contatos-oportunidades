
<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo contacto | Gestão de Contactos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3">
    <div class="container">
        <h1 class="h4 mb-0">Gestão de Contactos e Oportunidades</h1>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="h4 mb-4">Cadastrar novo contacto</h2>

                    <div th:if="${erro}" class="alert alert-danger"
                         th:text="${erro}"></div>

                    <form th:action="@{/contatos/salvar}"
                          th:object="${contato}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label for="nome" class="form-label">
                                Nome completo *
                            </label>
                            <input type="text" id="nome"
                                   th:field="*{nome}"
                                   class="form-control"
                                   maxlength="100"
                                   required>
                            <div class="text-danger small"
                                 th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label">
                                Telefone *
                            </label>
                            <input type="text" id="telefone"
                                   th:field="*{telefone}"
                                   class="form-control"
                                   maxlength="30"
                                   required>
                            <div class="text-danger small"
                                 th:errors="*{telefone}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input type="email" id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   maxlength="150">
                            <div class="text-danger small"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="tipoContacto" class="form-label">
                                Tipo de contacto *
                            </label>
                            <select id="tipoContacto"
                                    th:field="*{tipoContacto}"
                                    class="form-select" required>
                                <option value="">Selecione uma opção</option>
                                <option th:each="tipo : ${tiposContacto}"
                                        th:value="${tipo}"
                                        th:text="${tipo}">
                                </option>
                            </select>
                            <div class="text-danger small"
                                 th:errors="*{tipoContacto}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Guardar contacto
                            </button>

                            <a th:href="@{/contatos}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
